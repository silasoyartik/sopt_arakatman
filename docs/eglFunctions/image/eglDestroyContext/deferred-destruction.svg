<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="t d"><title id="t">Current context ertelenmiş silme</title><desc id="d">Destroy isteğinden sonraki geçerli make current çağrısına kadar context yaşamı.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#475569"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:18px;font-weight:700}.s{font-size:15px}.n{fill:#fff;stroke:#2563eb;stroke-width:2;rx:6}.w{fill:#fff7ed;stroke:#c2410c}.g{fill:#ecfdf5;stroke:#15803d}.l{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style></defs><rect width="1100" height="420" fill="#f8fafc"/><rect class="n" x="35" y="145" width="190" height="85"/><text class="h" x="130" y="179" text-anchor="middle">Context current</text><text class="s" x="130" y="207" text-anchor="middle">usable by thread</text><rect class="n w" x="285" y="145" width="220" height="85"/><text class="h" x="395" y="179" text-anchor="middle">Destroy requested</text><text class="s" x="395" y="207" text-anchor="middle">returns EGL_TRUE</text><rect class="n w" x="565" y="145" width="220" height="85"/><text class="h" x="675" y="179" text-anchor="middle">Deletion pending</text><text class="s" x="675" y="207" text-anchor="middle">still current</text><rect class="n g" x="845" y="125" width="220" height="125"/><text class="h" x="955" y="159" text-anchor="middle">Valid eglMakeCurrent</text><text class="s" x="955" y="189" text-anchor="middle">old binding removed</text><text class="s" x="955" y="219" text-anchor="middle">release may complete</text><path class="l" d="M225 187h60"/><path class="l" d="M505 187h60"/><path class="l" d="M785 187h60"/><text class="s" x="550" y="325" text-anchor="middle">EGL_TRUE acknowledges the deletion request; it does not guarantee immediate physical release.</text></svg>
