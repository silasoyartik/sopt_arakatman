<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">eglCreateWindowSurface win parametresi akışı</title>
  <desc id="desc">X11, Wayland, Win32 ve GBM native window nesneleri platform uyumluluğuna göre EGLSurface veya EGL_BAD_NATIVE_WINDOW sonucuna gider.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #172033; letter-spacing: 0; }
      .label { font-size: 20px; font-weight: 700; }
      .small { font-size: 17px; }
      .line { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .join { fill: none; stroke: #475569; stroke-width: 2.5; }
      .node { fill: #fff; stroke: #64748b; stroke-width: 2; rx: 6; }
      .platform { fill: #eff6ff; stroke: #2563eb; }
      .decision { fill: #fff7ed; stroke: #c2410c; }
      .good { fill: #ecfdf5; stroke: #15803d; }
      .bad { fill: #fff1f2; stroke: #be123c; }
    </style>
  </defs>
  <rect width="1100" height="600" fill="#f8fafc"/>
  <rect class="node" x="450" y="22" width="200" height="56"/>
  <text class="label" x="550" y="57" text-anchor="middle">win</text>
  <path class="join" d="M550 78 V112 M145 112 H955"/>
  <path class="line" d="M145 112 V143"/><path class="line" d="M415 112 V143"/><path class="line" d="M685 112 V143"/><path class="line" d="M955 112 V143"/>
  <rect class="node platform" x="45" y="143" width="200" height="72"/>
  <text class="label" x="145" y="173" text-anchor="middle">X11</text><text class="small" x="145" y="199" text-anchor="middle">Window</text>
  <rect class="node platform" x="315" y="143" width="200" height="72"/>
  <text class="label" x="415" y="173" text-anchor="middle">Wayland</text><text class="small" x="415" y="199" text-anchor="middle">wl_egl_window</text>
  <rect class="node platform" x="585" y="143" width="200" height="72"/>
  <text class="label" x="685" y="173" text-anchor="middle">Win32</text><text class="small" x="685" y="199" text-anchor="middle">HWND</text>
  <rect class="node platform" x="855" y="143" width="200" height="72"/>
  <text class="label" x="955" y="173" text-anchor="middle">Mesa/GBM</text><text class="small" x="955" y="199" text-anchor="middle">gbm_surface *</text>
  <path class="join" d="M145 215 V250 M415 215 V250 M685 215 V250 M955 215 V250 M145 250 H955"/>
  <path class="line" d="M550 250 V292"/>
  <rect class="node decision" x="325" y="292" width="450" height="74"/>
  <text class="label" x="550" y="322" text-anchor="middle">Aktif EGL platformuyla</text>
  <text class="label" x="550" y="350" text-anchor="middle">uyumlu ve geçerli mi?</text>
  <path class="line" d="M450 366 V415 H260 V447"/>
  <path class="line" d="M650 366 V415 H840 V447"/>
  <text class="small" x="342" y="405" text-anchor="middle">Evet</text><text class="small" x="758" y="405" text-anchor="middle">Hayır</text>
  <rect class="node good" x="115" y="447" width="290" height="64"/>
  <text class="label" x="260" y="486" text-anchor="middle">EGLSurface</text>
  <rect class="node bad" x="695" y="447" width="290" height="64"/>
  <text class="label" x="840" y="486" text-anchor="middle">EGL_NO_SURFACE</text>
  <path class="line" d="M840 511 V539"/>
  <rect class="node bad" x="690" y="539" width="300" height="48"/>
  <text class="small" x="840" y="570" text-anchor="middle">EGL_BAD_NATIVE_WINDOW</text>
</svg>
