<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="t d"><title id="t">Native window ve EGLSurface nesne modeli</title><desc id="d">Platform nesnesi, EGL display, config, surface ve context arasındaki ilişki.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#475569"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:21px;font-weight:700}.s{font-size:16px}.n{fill:#fff;stroke:#64748b;stroke-width:2;rx:6}.p{fill:#ecfeff;stroke:#0e7490}.e{fill:#eff6ff;stroke:#2563eb}.g{fill:#ecfdf5;stroke:#15803d}.l{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style></defs><rect width="1100" height="520" fill="#f8fafc"/><text class="h" x="550" y="38" text-anchor="middle">Native Window ile EGL Rendering Surface</text><rect class="n p" x="55" y="105" width="260" height="250"/><text class="h" x="185" y="140" text-anchor="middle">Native platform</text><text class="s" x="185" y="188" text-anchor="middle">X11 Window</text><text class="s" x="185" y="225" text-anchor="middle">wl_egl_window</text><text class="s" x="185" y="262" text-anchor="middle">Win32 HWND</text><text class="s" x="185" y="299" text-anchor="middle">GBM surface</text><rect class="n e" x="420" y="82" width="260" height="82"/><text class="h" x="550" y="116" text-anchor="middle">EGLDisplay</text><text class="s" x="550" y="144" text-anchor="middle">platform connection</text><rect class="n e" x="420" y="215" width="260" height="82"/><text class="h" x="550" y="249" text-anchor="middle">EGLConfig</text><text class="s" x="550" y="277" text-anchor="middle">framebuffer contract</text><rect class="n g" x="790" y="148" width="255" height="110"/><text class="h" x="918" y="188" text-anchor="middle">EGLSurface</text><text class="s" x="918" y="219" text-anchor="middle">rendering target</text><rect class="n e" x="790" y="340" width="255" height="82"/><text class="h" x="918" y="374" text-anchor="middle">EGLContext</text><text class="s" x="918" y="402" text-anchor="middle">OpenGL ES state</text><path class="l" d="M315 230h475"/><path class="l" d="M680 123h110v56"/><path class="l" d="M680 256h110v-37"/><path class="l" d="M918 258v82"/><text class="s" x="550" y="458" text-anchor="middle">eglCreateWindowSurface binds an existing native window to an EGLConfig on one EGLDisplay.</text></svg>
