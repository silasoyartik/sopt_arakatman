<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">eglCreateWindowSurface dpy parametresi akışı</title>
  <desc id="desc">Geçerli EGLDisplay başarılı surface oluşturabilir, EGL_NO_DISPLAY ise EGL_NO_SURFACE ile sonuçlanır.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #172033; letter-spacing: 0; }
      .label { font-size: 20px; font-weight: 700; }
      .small { font-size: 17px; }
      .line { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .node { fill: #ffffff; stroke: #64748b; stroke-width: 2; rx: 6; }
      .good { fill: #ecfdf5; stroke: #15803d; }
      .bad { fill: #fff1f2; stroke: #be123c; }
      .call { fill: #eff6ff; stroke: #2563eb; }
    </style>
  </defs>
  <rect width="1000" height="560" fill="#f8fafc"/>
  <rect class="node" x="400" y="25" width="200" height="58"/>
  <text class="label" x="500" y="61" text-anchor="middle">dpy</text>
  <path class="line" d="M500 83 V112 H250 V145"/>
  <path class="line" d="M500 112 H750 V145"/>
  <rect class="node good" x="105" y="145" width="290" height="64"/>
  <text class="label" x="250" y="184" text-anchor="middle">Geçerli EGLDisplay</text>
  <rect class="node bad" x="605" y="145" width="290" height="64"/>
  <text class="label" x="750" y="184" text-anchor="middle">EGL_NO_DISPLAY</text>
  <path class="line" d="M250 209 V250"/>
  <path class="line" d="M750 209 V250"/>
  <rect class="node call" x="85" y="250" width="330" height="64"/>
  <text class="small" x="250" y="289" text-anchor="middle">eglCreateWindowSurface()</text>
  <rect class="node call" x="585" y="250" width="330" height="64"/>
  <text class="small" x="750" y="289" text-anchor="middle">eglCreateWindowSurface()</text>
  <path class="line" d="M250 314 V355"/>
  <path class="line" d="M750 314 V355"/>
  <rect class="node good" x="105" y="355" width="290" height="78"/>
  <text class="small" x="250" y="386" text-anchor="middle">Diğer parametreler uygunsa</text>
  <text class="label" x="250" y="414" text-anchor="middle">EGLSurface</text>
  <rect class="node bad" x="605" y="355" width="290" height="78"/>
  <text class="small" x="750" y="386" text-anchor="middle">Surface oluşturulamaz</text>
  <text class="label" x="750" y="414" text-anchor="middle">EGL_NO_SURFACE</text>
  <path class="line" d="M750 433 V474"/>
  <rect class="node" x="650" y="474" width="200" height="56"/>
  <text class="small" x="750" y="509" text-anchor="middle">eglGetError()</text>
</svg>
