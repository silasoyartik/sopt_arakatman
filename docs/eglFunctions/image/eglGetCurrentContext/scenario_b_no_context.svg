<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
  <title id="title">Senaryo B aktif context yok akışı</title>
  <desc id="desc">After the current context is detached, eglGetCurrentContext returns EGL_NO_CONTEXT.</desc>
  <defs>
    <style>
      .bg { fill: #f6f7f9; }
      .title { font: 700 25px Arial, sans-serif; fill: #17202a; }
      .step { fill: #ffffff; stroke: #2f3a45; stroke-width: 2; }
      .ok { fill: #e6f4ef; stroke: #16875a; stroke-width: 2; }
      .warn { fill: #fff1f0; stroke: #c0362c; stroke-width: 2; }
      .label { font: 700 17px Arial, sans-serif; fill: #17202a; }
      .small { font: 15px Arial, sans-serif; fill: #475467; }
      .code { font: 16px Consolas, monospace; fill: #101828; }
      .arrow { stroke: #2f3a45; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#2f3a45"/>
    </marker>
  </defs>

  <rect class="bg" width="1120" height="460"/>
  <text class="title" x="48" y="54">Senaryo B: current context yoksa EGL_NO_CONTEXT döner</text>

  <rect class="ok" x="50" y="118" width="205" height="118" rx="8"/>
  <text class="label" x="78" y="155">1. İlk durum</text>
  <text class="code" x="78" y="187">current = ctx</text>

  <rect class="step" x="305" y="118" width="250" height="118" rx="8"/>
  <text class="label" x="333" y="155">2. Context ayrılır</text>
  <text class="code" x="333" y="187">eglMakeCurrent(...,</text>
  <text class="code" x="333" y="212">EGL_NO_CONTEXT)</text>

  <rect class="warn" x="605" y="118" width="220" height="118" rx="8"/>
  <text class="label" x="633" y="155">3. Thread state</text>
  <text class="code" x="633" y="187">current = yok</text>

  <rect class="step" x="875" y="118" width="210" height="118" rx="8"/>
  <text class="label" x="903" y="155">4. Getter çağrılır</text>
  <text class="code" x="903" y="187">eglGetCurrent</text>
  <text class="code" x="903" y="212">Context()</text>

  <path class="arrow" d="M255 177 L305 177"/>
  <path class="arrow" d="M555 177 L605 177"/>
  <path class="arrow" d="M825 177 L875 177"/>

  <path class="arrow" d="M980 236 C980 286,825 306,730 306"/>

  <rect class="warn" x="430" y="290" width="300" height="78" rx="8"/>
  <text class="label" x="458" y="322">5. Dönüş</text>
  <text class="code" x="458" y="348">EGL_NO_CONTEXT</text>

  <rect class="warn" x="190" y="380" width="740" height="52" rx="8"/>
  <text class="small" x="220" y="413">Aktif context yoktur; bu durum `eglGetCurrentContext` için tek başına hata değildir.</text>
</svg>
