<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Senaryo B aktif context yok akışı</title>
  <desc id="desc">The context is detached, eglGetCurrentContext returns EGL_NO_CONTEXT, and no triangle is drawn.</desc>
  <defs>
    <style>
      .bg { fill: #f6f7f9; }
      .title { font: 700 25px Arial, sans-serif; fill: #17202a; }
      .step { fill: #ffffff; stroke: #2f3a45; stroke-width: 2; }
      .warn { fill: #fff1f0; stroke: #c0362c; stroke-width: 2; }
      .note { fill: #fffaf0; stroke: #b7791f; stroke-width: 2; }
      .screen { fill: #de3028; stroke: #2f3a45; stroke-width: 2; }
      .label { font: 700 17px Arial, sans-serif; fill: #17202a; }
      .small { font: 15px Arial, sans-serif; fill: #475467; }
      .code { font: 16px Consolas, monospace; fill: #101828; }
      .arrow { stroke: #2f3a45; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .muted { stroke: #98a2b3; stroke-width: 2; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrowmuted); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#2f3a45"/>
    </marker>
    <marker id="arrowmuted" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#98a2b3"/>
    </marker>
  </defs>

  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="48" y="54">Senaryo B: context ayrıldıktan sonra current context yoktur</text>

  <rect class="step" x="42" y="105" width="210" height="118" rx="8"/>
  <text class="label" x="70" y="142">1. İlk durum</text>
  <text class="code" x="70" y="174">ctx current</text>
  <text class="small" x="70" y="200">ekran kırmızıya temizlenir</text>

  <rect class="warn" x="300" y="105" width="235" height="118" rx="8"/>
  <text class="label" x="328" y="142">2. Context detach edilir</text>
  <text class="code" x="328" y="174">EGL_NO_CONTEXT</text>
  <text class="small" x="328" y="200">thread'deki current state boşalır</text>

  <rect class="warn" x="585" y="105" width="250" height="118" rx="8"/>
  <text class="label" x="613" y="142">3. Getter çağrılır</text>
  <text class="code" x="613" y="174">eglGetCurrentContext()</text>
  <text class="small" x="613" y="200">EGL_NO_CONTEXT döndürür</text>

  <rect class="note" x="885" y="105" width="190" height="118" rx="8"/>
  <text class="label" x="913" y="142">4. Yeni çizim yok</text>
  <text class="code" x="913" y="174">glDraw* çağrılmaz</text>
  <text class="small" x="913" y="200">yalnızca buffer gösterilir</text>

  <path class="arrow" d="M252 164 L300 164"/>
  <path class="arrow" d="M535 164 L585 164"/>
  <path class="arrow" d="M835 164 L885 164"/>

  <rect class="screen" x="735" y="300" width="260" height="132" rx="8"/>
  <text class="small" x="757" y="464">Beklenen görüntü: kırmızı arka plan, üçgen yok</text>
  <path class="muted" d="M980 223 C970 260,950 282,920 300"/>

  <rect class="warn" x="125" y="305" width="440" height="94" rx="8"/>
  <text class="label" x="154" y="340">Çıkarım</text>
  <text class="code" x="154" y="371">current == EGL_NO_CONTEXT</text>
  <text class="small" x="154" y="392">Context olmadığı için render komutları güvenli değildir.</text>

  <path class="arrow" d="M565 352 L735 352"/>
</svg>
