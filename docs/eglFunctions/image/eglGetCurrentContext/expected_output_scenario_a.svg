<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Senaryo A beklenen ekran çıktısı</title>
  <desc id="desc">A dark teal screen with a red, green, and blue triangle, representing successful rendering with an active EGL context.</desc>
  <defs>
    <style>
      .page { fill: #f6f7f9; }
      .frame { fill: #202f31; stroke: #17202a; stroke-width: 3; }
      .label { font: 700 24px Arial, sans-serif; fill: #17202a; }
      .small { font: 16px Arial, sans-serif; fill: #475467; }
      .caption { font: 17px Arial, sans-serif; fill: #344054; }
      .badge { fill: #e6f4ef; stroke: #16875a; stroke-width: 2; }
      .code { font: 16px Consolas, monospace; fill: #101828; }
    </style>
    <linearGradient id="tri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5483e"/>
      <stop offset="0.52" stop-color="#19a974"/>
      <stop offset="1" stop-color="#3478f6"/>
    </linearGradient>
  </defs>

  <rect class="page" width="900" height="560"/>
  <text class="label" x="60" y="58">Senaryo A beklenen görüntü</text>
  <text class="small" x="60" y="86">Context aktif: OpenGL ES çizimi ekrana taşınır.</text>

  <rect class="frame" x="100" y="125" width="700" height="350" rx="10"/>
  <polygon points="450,188 285,414 615,414" fill="url(#tri)"/>
  <circle cx="450" cy="188" r="10" fill="#e5483e"/>
  <circle cx="285" cy="414" r="10" fill="#19a974"/>
  <circle cx="615" cy="414" r="10" fill="#3478f6"/>

  <rect class="badge" x="255" y="500" width="390" height="42" rx="8"/>
  <text class="code" x="280" y="527">eglGetCurrentContext() == state.egl_context</text>
</svg>
