<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">Senaryo A aktif context akışı</title>
  <desc id="desc">After eglMakeCurrent succeeds, eglGetCurrentContext returns the same active context handle.</desc>
  <defs>
    <style>
      .bg { fill: #f6f7f9; }
      .title { font: 700 25px Arial, sans-serif; fill: #17202a; }
      .step { fill: #ffffff; stroke: #2f3a45; stroke-width: 2; }
      .ok { fill: #e6f4ef; stroke: #16875a; stroke-width: 2; }
      .label { font: 700 17px Arial, sans-serif; fill: #17202a; }
      .small { font: 15px Arial, sans-serif; fill: #475467; }
      .code { font: 16px Consolas, monospace; fill: #101828; }
      .arrow { stroke: #2f3a45; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#2f3a45"/>
    </marker>
  </defs>

  <rect class="bg" width="1120" height="440"/>
  <text class="title" x="48" y="54">Senaryo A: current context varsa aynı handle döner</text>

  <rect class="step" x="60" y="118" width="235" height="118" rx="8"/>
  <text class="label" x="88" y="155">1. Context bağlanır</text>
  <text class="code" x="88" y="187">eglMakeCurrent(..., ctx)</text>
  <text class="small" x="88" y="213">çağıran thread current olur</text>

  <rect class="ok" x="350" y="118" width="220" height="118" rx="8"/>
  <text class="label" x="378" y="155">2. Thread state</text>
  <text class="code" x="378" y="187">current = ctx</text>

  <rect class="step" x="625" y="118" width="240" height="118" rx="8"/>
  <text class="label" x="653" y="155">3. Getter çağrılır</text>
  <text class="code" x="653" y="187">eglGetCurrentContext()</text>

  <rect class="ok" x="920" y="118" width="150" height="118" rx="8"/>
  <text class="label" x="948" y="155">4. Dönüş</text>
  <text class="code" x="960" y="187">ctx</text>
  <text class="small" x="948" y="213">Başarılı</text>

  <path class="arrow" d="M295 177 L350 177"/>
  <path class="arrow" d="M570 177 L625 177"/>
  <path class="arrow" d="M865 177 L920 177"/>

  <rect class="ok" x="180" y="310" width="760" height="72" rx="8"/>
  <text class="label" x="215" y="342">Test kontrolü</text>
  <text class="code" x="215" y="367">eglGetCurrentContext() == state.egl_context</text>
  <text class="small" x="635" y="367">Fonksiyon aktif context'i doğru döndürür.</text>
</svg>
