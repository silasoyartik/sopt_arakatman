<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="t d"><title id="t">EGL 1.0 hata kodu grupları</title><desc id="d">EGL hata kodları state, kaynak, handle, uyumluluk ve native platform gruplarında gösterilir.</desc><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:20px;font-weight:700}.s{font-size:16px}.n{stroke-width:2;rx:6}.ok{fill:#ecfdf5;stroke:#15803d}.state{fill:#eff6ff;stroke:#2563eb}.handle{fill:#fff1f2;stroke:#be123c}.match{fill:#fff7ed;stroke:#c2410c}.native{fill:#ecfeff;stroke:#0e7490}</style><rect width="1100" height="620" fill="#f8fafc"/><text class="h" x="550" y="40" text-anchor="middle">EGL 1.0 Error Taxonomy</text><rect class="n ok" x="55" y="75" width="300" height="85"/><text class="h" x="205" y="109" text-anchor="middle">No error</text><text class="s" x="205" y="138" text-anchor="middle">EGL_SUCCESS</text><rect class="n state" x="400" y="75" width="645" height="120"/><text class="h" x="723" y="109" text-anchor="middle">State, access and allocation</text><text class="s" x="723" y="140" text-anchor="middle">EGL_NOT_INITIALIZED | EGL_BAD_ACCESS | EGL_BAD_ALLOC</text><text class="s" x="723" y="170" text-anchor="middle">EGL_BAD_CURRENT_SURFACE</text><rect class="n handle" x="55" y="235" width="470" height="190"/><text class="h" x="290" y="270" text-anchor="middle">Invalid EGL handles</text><text class="s" x="290" y="310" text-anchor="middle">EGL_BAD_CONFIG | EGL_BAD_CONTEXT</text><text class="s" x="290" y="345" text-anchor="middle">EGL_BAD_DISPLAY | EGL_BAD_SURFACE</text><text class="s" x="290" y="390" text-anchor="middle">The code identifies the invalid object category.</text><rect class="n match" x="575" y="235" width="470" height="190"/><text class="h" x="810" y="270" text-anchor="middle">Contract and compatibility</text><text class="s" x="810" y="310" text-anchor="middle">EGL_BAD_ATTRIBUTE</text><text class="s" x="810" y="345" text-anchor="middle">EGL_BAD_MATCH | EGL_BAD_PARAMETER</text><text class="s" x="810" y="390" text-anchor="middle">Valid objects may still be incompatible.</text><rect class="n native" x="230" y="475" width="640" height="105"/><text class="h" x="550" y="510" text-anchor="middle">Native platform objects</text><text class="s" x="550" y="545" text-anchor="middle">EGL_BAD_NATIVE_PIXMAP | EGL_BAD_NATIVE_WINDOW</text></svg>
