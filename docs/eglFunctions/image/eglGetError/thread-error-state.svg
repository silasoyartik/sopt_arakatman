<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="460" viewBox="0 0 1050 460" role="img" aria-labelledby="t d"><title id="t">Thread-local EGL error state</title><desc id="d">Her thread kendi EGL error state değerine sahiptir.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#475569"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:20px;font-weight:700}.s{font-size:16px}.n{fill:#fff;stroke:#64748b;stroke-width:2;rx:6}.th{fill:#eff6ff;stroke:#2563eb}.er{fill:#fff7ed;stroke:#c2410c}.l{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style></defs><rect width="1050" height="460" fill="#f8fafc"/><text class="h" x="525" y="40" text-anchor="middle">Thread-Local EGL Error State</text><rect class="n th" x="70" y="100" width="240" height="75"/><text class="h" x="190" y="145" text-anchor="middle">Thread A</text><rect class="n th" x="405" y="100" width="240" height="75"/><text class="h" x="525" y="145" text-anchor="middle">Thread B</text><rect class="n th" x="740" y="100" width="240" height="75"/><text class="h" x="860" y="145" text-anchor="middle">Thread C</text><path class="l" d="M190 175v80"/><path class="l" d="M525 175v80"/><path class="l" d="M860 175v80"/><rect class="n er" x="70" y="255" width="240" height="90"/><text class="h" x="190" y="290" text-anchor="middle">Error state A</text><text class="s" x="190" y="320" text-anchor="middle">read only by A</text><rect class="n er" x="405" y="255" width="240" height="90"/><text class="h" x="525" y="290" text-anchor="middle">Error state B</text><text class="s" x="525" y="320" text-anchor="middle">read only by B</text><rect class="n er" x="740" y="255" width="240" height="90"/><text class="h" x="860" y="290" text-anchor="middle">Error state C</text><text class="s" x="860" y="320" text-anchor="middle">read only by C</text><text class="s" x="525" y="406" text-anchor="middle">eglGetError() never transfers an error between threads.</text></svg>
