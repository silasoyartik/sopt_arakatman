<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="t d"><title id="t">EGL 1.0 hata kodu senaryoları</title><desc id="d">eglGetError ile görülebilecek 14 temel sonuç gruplandırılmıştır.</desc><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:21px;font-weight:700}.s{font-size:16px}.box{stroke-width:2;rx:6}.ok{fill:#ecfdf5;stroke:#15803d}.state{fill:#eff6ff;stroke:#2563eb}.object{fill:#fff1f2;stroke:#be123c}.relation{fill:#fff7ed;stroke:#c2410c}</style><rect width="1100" height="620" fill="#f8fafc"/><text class="h" x="550" y="42" text-anchor="middle">eglGetError() ile Görülebilecek Sonuçlar</text><rect class="box ok" x="60" y="75" width="450" height="72"/><text class="h" x="285" y="107" text-anchor="middle">Hata yok</text><text class="s" x="285" y="132" text-anchor="middle">EGL_SUCCESS</text><rect class="box state" x="590" y="75" width="450" height="132"/><text class="h" x="815" y="107" text-anchor="middle">Durum ve kaynak hataları</text><text class="s" x="815" y="136" text-anchor="middle">EGL_NOT_INITIALIZED  |  EGL_BAD_ACCESS</text><text class="s" x="815" y="164" text-anchor="middle">EGL_BAD_ALLOC</text><text class="s" x="815" y="192" text-anchor="middle">EGL_BAD_CURRENT_SURFACE</text><rect class="box object" x="60" y="235" width="450" height="245"/><text class="h" x="285" y="269" text-anchor="middle">Geçersiz nesne handle'ları</text><text class="s" x="285" y="307" text-anchor="middle">EGL_BAD_CONTEXT</text><text class="s" x="285" y="339" text-anchor="middle">EGL_BAD_CONFIG</text><text class="s" x="285" y="371" text-anchor="middle">EGL_BAD_DISPLAY</text><text class="s" x="285" y="403" text-anchor="middle">EGL_BAD_SURFACE</text><text class="s" x="285" y="435" text-anchor="middle">EGL_BAD_NATIVE_PIXMAP</text><text class="s" x="285" y="467" text-anchor="middle">EGL_BAD_NATIVE_WINDOW</text><rect class="box relation" x="590" y="235" width="450" height="185"/><text class="h" x="815" y="269" text-anchor="middle">Attribute ve uyumluluk hataları</text><text class="s" x="815" y="312" text-anchor="middle">EGL_BAD_ATTRIBUTE</text><text class="s" x="815" y="348" text-anchor="middle">EGL_BAD_MATCH</text><text class="s" x="815" y="384" text-anchor="middle">EGL_BAD_PARAMETER</text><rect class="box state" x="590" y="448" width="450" height="104"/><text class="h" x="815" y="482" text-anchor="middle">Ortak kural</text><text class="s" x="815" y="514" text-anchor="middle">Hata, başarısız EGL çağrısından hemen sonra</text><text class="s" x="815" y="539" text-anchor="middle">aynı thread üzerinde okunur.</text></svg>
