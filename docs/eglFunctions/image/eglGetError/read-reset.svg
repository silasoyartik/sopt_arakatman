<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="t d"><title id="t">EGL hata durumunu okuma ve resetleme</title><desc id="d">Başarısız EGL çağrısı hata durumunu ayarlar, eglGetError okur ve EGL_SUCCESS değerine resetler.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#475569"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:18px;font-weight:700}.s{font-size:15px}.n{fill:#fff;stroke:#2563eb;stroke-width:2;rx:6}.b{fill:#fff1f2;stroke:#be123c}.g{fill:#ecfdf5;stroke:#15803d}.l{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style></defs><rect width="1100" height="390" fill="#f8fafc"/><text class="h" x="550" y="38" text-anchor="middle">Read-and-Reset Behavior</text><rect class="n" x="35" y="130" width="205" height="88"/><text class="h" x="138" y="165" text-anchor="middle">EGL function</text><text class="s" x="138" y="194" text-anchor="middle">fails</text><rect class="n b" x="300" y="130" width="220" height="88"/><text class="h" x="410" y="165" text-anchor="middle">Error recorded</text><text class="s" x="410" y="194" text-anchor="middle">thread-local state</text><rect class="n" x="580" y="130" width="220" height="88"/><text class="h" x="690" y="165" text-anchor="middle">eglGetError()</text><text class="s" x="690" y="194" text-anchor="middle">returns code</text><rect class="n g" x="860" y="130" width="205" height="88"/><text class="h" x="963" y="165" text-anchor="middle">State reset</text><text class="s" x="963" y="194" text-anchor="middle">EGL_SUCCESS</text><path class="l" d="M240 174h60"/><path class="l" d="M520 174h60"/><path class="l" d="M800 174h60"/><text class="s" x="550" y="300" text-anchor="middle">A second eglGetError() returns EGL_SUCCESS unless another EGL error occurs.</text></svg>
