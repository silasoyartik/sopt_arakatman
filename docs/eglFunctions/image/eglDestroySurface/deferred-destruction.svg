<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="t d"><title id="t">Current surface ertelenmiş silme</title><desc id="d">Current draw veya read surface için destroy isteğinin make current sonrası tamamlanması.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#475569"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:18px;font-weight:700}.s{font-size:15px}.n{fill:#fff;stroke:#2563eb;stroke-width:2;rx:6}.w{fill:#fff7ed;stroke:#c2410c}.g{fill:#ecfdf5;stroke:#15803d}.l{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style></defs><rect width="1100" height="430" fill="#f8fafc"/><text class="h" x="550" y="38" text-anchor="middle">Deferred Surface Destruction</text><rect class="n" x="35" y="145" width="200" height="92"/><text class="h" x="135" y="180" text-anchor="middle">Surface current</text><text class="s" x="135" y="208" text-anchor="middle">draw and/or read</text><rect class="n w" x="290" y="145" width="220" height="92"/><text class="h" x="400" y="180" text-anchor="middle">Destroy requested</text><text class="s" x="400" y="208" text-anchor="middle">returns EGL_TRUE</text><rect class="n w" x="565" y="145" width="220" height="92"/><text class="h" x="675" y="180" text-anchor="middle">Deletion pending</text><text class="s" x="675" y="208" text-anchor="middle">binding remains valid</text><rect class="n g" x="840" y="125" width="225" height="132"/><text class="h" x="953" y="160" text-anchor="middle">Valid eglMakeCurrent</text><text class="s" x="953" y="191" text-anchor="middle">old surface unbound</text><text class="s" x="953" y="220" text-anchor="middle">release may complete</text><path class="l" d="M235 191h55"/><path class="l" d="M510 191h55"/><path class="l" d="M785 191h55"/><text class="s" x="550" y="334" text-anchor="middle">The surface remains usable only through the current binding while deletion is pending.</text></svg>
