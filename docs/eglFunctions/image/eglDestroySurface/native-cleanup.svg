<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="440" viewBox="0 0 1050 440" role="img" aria-labelledby="t d"><title id="t">EGL ve native surface cleanup sırası</title><desc id="d">Current binding release, EGLSurface destroy ve native surface destroy sırası.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#475569"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:19px;font-weight:700}.s{font-size:15px}.n{fill:#fff;stroke:#2563eb;stroke-width:2;rx:6}.p{fill:#ecfeff;stroke:#0e7490}.g{fill:#ecfdf5;stroke:#15803d}.l{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style></defs><rect width="1050" height="440" fill="#f8fafc"/><text class="h" x="525" y="42" text-anchor="middle">EGL and Native Resource Cleanup</text><rect class="n" x="45" y="145" width="210" height="90"/><text class="h" x="150" y="180" text-anchor="middle">Release binding</text><text class="s" x="150" y="208" text-anchor="middle">eglMakeCurrent</text><rect class="n" x="315" y="145" width="210" height="90"/><text class="h" x="420" y="180" text-anchor="middle">Destroy context</text><text class="s" x="420" y="208" text-anchor="middle">EGL ownership</text><rect class="n" x="585" y="145" width="210" height="90"/><text class="h" x="690" y="180" text-anchor="middle">Destroy surface</text><text class="s" x="690" y="208" text-anchor="middle">EGL ownership</text><rect class="n p" x="855" y="125" width="160" height="130"/><text class="h" x="935" y="163" text-anchor="middle">Destroy native</text><text class="s" x="935" y="194" text-anchor="middle">window / pixmap</text><text class="s" x="935" y="221" text-anchor="middle">/ GBM surface</text><path class="l" d="M255 190h60"/><path class="l" d="M525 190h60"/><path class="l" d="M795 190h60"/><rect class="n g" x="355" y="315" width="340" height="65"/><text class="s" x="525" y="354" text-anchor="middle">Each ownership domain uses its own destroy API.