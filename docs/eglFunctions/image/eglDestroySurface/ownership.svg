<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="470" viewBox="0 0 1050 470" role="img" aria-labelledby="t d"><title id="t">EGLSurface türleri ve sahiplik modeli</title><desc id="d">Window, pixmap ve pbuffer surface türlerinin EGLDisplay ve native nesnelerle ilişkisi.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#475569"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:20px;font-weight:700}.s{font-size:16px}.n{fill:#fff;stroke:#64748b;stroke-width:2;rx:6}.e{fill:#eff6ff;stroke:#2563eb}.p{fill:#ecfeff;stroke:#0e7490}.g{fill:#ecfdf5;stroke:#15803d}.l{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style></defs><rect width="1050" height="470" fill="#f8fafc"/><text class="h" x="525" y="38" text-anchor="middle">EGLSurface Ownership Model</text><rect class="n e" x="65" y="175" width="220" height="82"/><text class="h" x="175" y="210" text-anchor="middle">EGLDisplay</text><text class="s" x="175" y="238" text-anchor="middle">owns EGL namespace</text><rect class="n g" x="415" y="175" width="220" height="82"/><text class="h" x="525" y="210" text-anchor="middle">EGLSurface</text><text class="s" x="525" y="238" text-anchor="middle">rendering target</text><path class="l" d="M285 216h130"/><rect class="n p" x="760" y="55" width="230" height="76"/><text class="h" x="875" y="87" text-anchor="middle">Window surface</text><text class="s" x="875" y="113" text-anchor="middle">native window</text><rect class="n p" x="760" y="177" width="230" height="76"/><text class="h" x="875" y="209" text-anchor="middle">Pixmap surface</text><text class="s" x="875" y="235" text-anchor="middle">native pixmap</text><rect class="n p" x="760" y="299" width="230" height="76"/><text class="h" x="875" y="331" text-anchor="middle">Pbuffer surface</text><text class="s" x="875" y="357" text-anchor="middle">EGL off-screen</text><path class="l" d="M635 205h65V93h60"/><path class="l" d="M635 216h125"/><path class="l" d="M635 227h65v110h60"/><text class="s" x="525" y="426" text-anchor="middle">Destroying an EGLSurface does not destroy its native window or native pixmap.</text></svg>
