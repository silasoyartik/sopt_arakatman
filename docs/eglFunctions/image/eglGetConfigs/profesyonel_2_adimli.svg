<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Profesyonel iki adimli eglGetConfigs sorgusu</title>
  <desc id="desc">Once toplam config sayisinin ogrenilmesi, sonra tam boyutlu bellek ayrilip tum config listesinin okunmasi.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#263238"/></marker>
    <style>
      .bg{fill:#f7fafc}.box{fill:#ffffff;stroke:#263238;stroke-width:2;rx:10}.good{fill:#e8f7ef;stroke:#177245;stroke-width:2;rx:10}.accent{fill:#eaf2ff;stroke:#2457a6;stroke-width:2;rx:10}.slot{fill:#f8fafc;stroke:#64748b;stroke-width:1.6;rx:6}
      .title{font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:700;fill:#111827}.text{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#1f2937}.small{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#405064}.mono{font-family:Consolas,Menlo,monospace;font-size:16px;fill:#111827}.line{stroke:#263238;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="40" y="48">Onerilen kullanim: iki adimli sorgu</text>
  <text class="small" x="40" y="76">Amac: once kapasiteyi ogrenmek, sonra tum config handle'larini eksiksiz almak.</text>
  <rect class="box" x="55" y="135" width="230" height="120"/>
  <text class="text" x="102" y="174">1. Sayiyi ogren</text>
  <text class="mono" x="82" y="207">configs = NULL</text>
  <text class="small" x="96" y="232">num_config = toplam</text>
  <rect class="accent" x="360" y="135" width="230" height="120"/>
  <text class="text" x="408" y="174">2. Bellek ayir</text>
  <text class="mono" x="405" y="207">malloc(toplam)</text>
  <text class="small" x="408" y="232">configs[] hazirlanir</text>
  <rect class="box" x="665" y="135" width="230" height="120"/>
  <text class="text" x="716" y="174">3. Listeyi oku</text>
  <text class="mono" x="702" y="207">configs = dizi</text>
  <text class="small" x="704" y="232">num_config = toplam</text>
  <path class="line" d="M285 195 L360 195"/>
  <path class="line" d="M590 195 L665 195"/>
  <rect class="good" x="300" y="330" width="520" height="118"/>
  <text class="text" x="420" y="366">Sonuc: tam config havuzu bellekte</text>
  <rect class="slot" x="382" y="392" width="74" height="34"/><text class="mono" x="398" y="415">[0]</text>
  <rect class="slot" x="474" y="392" width="74" height="34"/><text class="mono" x="490" y="415">[1]</text>
  <rect class="slot" x="566" y="392" width="74" height="34"/><text class="mono" x="582" y="415">[2]</text>
  <rect class="slot" x="658" y="392" width="74" height="34"/><text class="mono" x="674" y="415">[N]</text>
  <text class="mono" x="374" y="484">configs[0..toplam-1] dolu, num_config = toplam</text>
</svg>
