<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Profesyonel iki adımlı eglGetConfigs sorgusu</title>
  <desc id="desc">Önce toplam config sayısının öğrenilmesi, sonra tam boyutlu bellek ayrılıp tüm config listesinin okunması.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#263238"/>
    </marker>
    <style>
      .bg{fill:#f7fafc}
      .box{fill:#ffffff;stroke:#263238;stroke-width:2;rx:10}
      .good{fill:#e8f7ef;stroke:#177245;stroke-width:2;rx:10}
      .accent{fill:#eaf2ff;stroke:#2457a6;stroke-width:2;rx:10}
      .title{font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:700;fill:#111827}
      .text{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#1f2937}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#405064}
      .mono{font-family:Consolas,Menlo,monospace;font-size:16px;fill:#111827}
      .line{stroke:#263238;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1120" height="520"/>
  <text class="title" x="40" y="48">Önerilen kullanım: iki adımlı sorgu</text>
  <text class="small" x="40" y="76">Amaç: ne eksik okumak ne de gereksiz sabit dizi boyutlarına güvenmek.</text>

  <rect class="box" x="55" y="135" width="230" height="120"/>
  <text class="text" x="102" y="174">1. Sayıyı öğren</text>
  <text class="mono" x="82" y="207">configs = NULL</text>
  <text class="small" x="96" y="232">num_config = toplam</text>

  <rect class="accent" x="360" y="135" width="230" height="120"/>
  <text class="text" x="408" y="174">2. Bellek ayır</text>
  <text class="mono" x="405" y="207">malloc(toplam)</text>
  <text class="small" x="408" y="232">Tam kapasite hazırlanır</text>

  <rect class="box" x="665" y="135" width="230" height="120"/>
  <text class="text" x="716" y="174">3. Listeyi oku</text>
  <text class="mono" x="702" y="207">configs = dizi</text>
  <text class="small" x="704" y="232">Tüm havuz kopyalanır</text>

  <rect class="good" x="330" y="330" width="460" height="112"/>
  <text class="text" x="430" y="370">Sonuç: güvenilir config seçimi</text>
  <text class="small" x="372" y="402">Surface, renderable type, renk ve depth özellikleri tüm havuz üzerinden kontrol edilir.</text>

  <path class="line" d="M285 195 L360 195"/>
  <path class="line" d="M590 195 L665 195"/>
  <path class="line" d="M780 255 C780 300,728 322,665 340"/>
  <path class="line" d="M170 255 C170 312,275 335,330 362"/>

  <text class="mono" x="346" y="480">Örnek sonuç: depth buffer aktif -> yeşil üçgen kırmızı üçgenin önünde görünür</text>
</svg>
