<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Terminal kanıtı akışı</title>
  <desc id="desc">Çizim üretmeyen senaryolarda hata veya güvenli reddetme bilgisinin terminal çıktısıyla gösterilmesi.</desc>
  <style>
    .bg{fill:#f7fafc}.term{fill:#111827;stroke:#263238;stroke-width:3;rx:12}.bar{fill:#243044}.green{fill:#38d996}.yellow{fill:#ffd166}.red{fill:#ff6b6b}
    .title{font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:700;fill:#111827}.text{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#1f2937}.mono{font-family:Consolas,Menlo,monospace;font-size:17px;fill:#e5e7eb}.muted{font-family:Consolas,Menlo,monospace;font-size:15px;fill:#a7b0bf}
  </style>
  <rect class="bg" width="900" height="430"/>
  <text class="title" x="40" y="48">Çizim yoksa kanıt terminal çıktısıdır</text>
  <text class="text" x="40" y="78">Geçersiz display veya güvenli reddetme senaryosunda amaç hata yolunu göstermek.</text>
  <rect class="term" x="70" y="118" width="760" height="230"/>
  <rect class="bar" x="70" y="118" width="760" height="34"/>
  <circle class="red" cx="95" cy="135" r="6"/><circle class="yellow" cx="116" cy="135" r="6"/><circle class="green" cx="137" cy="135" r="6"/>
  <text class="mono" x="100" y="190">BEKLENEN HATA: eglGetConfigs başarısız oldu.</text>
  <text class="mono" x="100" y="225">EGL hata kodu: EGL_BAD_DISPLAY (0x3008)</text>
  <text class="muted" x="100" y="262">Surface/context kurulmaz; çizim aşamasına geçilmez.</text>
  <text class="muted" x="100" y="296">Program kontrollü şekilde kapanır.</text>
  <text class="text" x="128" y="386">Bu görsel, hata senaryolarında “neden ekran görüntüsü yok?” sorusunu açıklar.</text>
</svg>
