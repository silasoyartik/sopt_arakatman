<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Hata akisi</title>
  <desc id="desc">Gecersiz parametre veya gecersiz display durumunda eglGetConfigs cagrisi icin hata kodunun kontrol edilmesi.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#263238"/></marker>
    <style>
      .bg{fill:#f7fafc}.box{fill:#ffffff;stroke:#263238;stroke-width:2;rx:10}.bad{fill:#fdecec;stroke:#b42318;stroke-width:2;rx:8}.err{fill:#fff6df;stroke:#b7791f;stroke-width:2;rx:8}
      .title{font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:700;fill:#111827}.text{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#1f2937}.mono{font-family:Consolas,Menlo,monospace;font-size:16px;fill:#111827}.line{stroke:#263238;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="900" height="430"/>
  <text class="title" x="40" y="48">Basarisiz eglGetConfigs cagrisi hata koduyla kanitlanir</text>
  <text class="text" x="40" y="78">Gorsel sonuc, cizim degil; return value ve eglGetError() ciktisidir.</text>
  <rect class="box" x="70" y="128" width="210" height="150"/>
  <text class="mono" x="102" y="178">EGL_NO_DISPLAY</text>
  <text class="mono" x="112" y="214">veya NULL</text>
  <path class="line" d="M280 202 L380 202"/>
  <rect class="box" x="380" y="128" width="210" height="150"/>
  <text class="mono" x="420" y="190">eglGetConfigs</text>
  <text class="mono" x="432" y="222">(...)</text>
  <path class="line" d="M590 202 L690 202"/>
  <rect class="bad" x="690" y="128" width="150" height="62"/>
  <text class="mono" x="720" y="166">EGL_FALSE</text>
  <rect class="err" x="690" y="216" width="150" height="62"/>
  <text class="mono" x="708" y="254">eglGetError()</text>
  <text class="mono" x="108" y="348">Ornek: EGL_NO_DISPLAY -&gt; EGL_BAD_DISPLAY</text>
  <text class="mono" x="108" y="376">Ornek: num_config NULL -&gt; EGL_BAD_PARAMETER</text>
</svg>
