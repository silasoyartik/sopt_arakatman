<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-labelledby="title desc">
  <title id="title">configs dizisine veri okuma</title>
  <desc id="desc">Geçerli configs dizisine EGLConfig handle'larının kopyalanması ve uygun config ile sarı üçgen çizilmesi.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#263238"/></marker>
    <style>
      .bg{fill:#f7fafc}.box{fill:#ffffff;stroke:#263238;stroke-width:2;rx:10}.slot{fill:#eaf2ff;stroke:#2457a6;stroke-width:1.6;rx:6}.screen{fill:#111947;stroke:#111827;stroke-width:3;rx:10}
      .title{font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:700;fill:#111827}.text{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#1f2937}.mono{font-family:Consolas,Menlo,monospace;font-size:15px;fill:#111827}.line{stroke:#263238;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="820" height="430"/>
  <text class="title" x="34" y="44">configs geçerli dizi: handle'lar belleğe yazılır</text>
  <rect class="box" x="40" y="92" width="250" height="210"/>
  <text class="text" x="78" y="128">EGLConfig havuzu</text>
  <rect class="slot" x="72" y="154" width="184" height="30"/><text class="mono" x="96" y="175">Config[0]</text>
  <rect class="slot" x="72" y="194" width="184" height="30"/><text class="mono" x="96" y="215">Config[1]</text>
  <rect class="slot" x="72" y="234" width="184" height="30"/><text class="mono" x="96" y="255">Config[2] ...</text>
  <rect class="box" x="370" y="92" width="170" height="210"/>
  <text class="text" x="402" y="128">configs[]</text>
  <rect class="slot" x="402" y="154" width="106" height="30"/><text class="mono" x="417" y="175">handle</text>
  <rect class="slot" x="402" y="194" width="106" height="30"/><text class="mono" x="417" y="215">handle</text>
  <text class="mono" x="392" y="265">num_config = N</text>
  <rect class="screen" x="610" y="92" width="170" height="210"/>
  <polygon points="695,140 642,260 748,260" fill="#ffd23f"/>
  <path class="line" d="M290 195 L370 195"/>
  <path class="line" d="M540 195 L610 195"/>
  <text class="mono" x="160" y="360">Sonuç: uygun config ile lacivert zemin üzerinde sarı üçgen çizilir.</text>
</svg>
