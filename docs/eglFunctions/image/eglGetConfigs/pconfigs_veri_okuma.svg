<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-labelledby="title desc">
  <title id="title">configs dizisine veri okuma</title>
  <desc id="desc">EGLConfig havuzundaki handle degerlerinin configs dizisine kopyalanmasi ve num_config alaninin guncellenmesi.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#263238"/></marker>
    <style>
      .bg{fill:#f7fafc}.box{fill:#ffffff;stroke:#263238;stroke-width:2;rx:10}.slot{fill:#eaf2ff;stroke:#2457a6;stroke-width:1.8;rx:6}.count{fill:#e8f7ef;stroke:#177245;stroke-width:2;rx:8}
      .title{font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:700;fill:#111827}.text{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#1f2937}.mono{font-family:Consolas,Menlo,monospace;font-size:15px;fill:#111827}.line{stroke:#263238;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="820" height="430"/>
  <text class="title" x="34" y="44">configs gecerli dizi: handle'lar bellege yazilir</text>
  <rect class="box" x="42" y="92" width="250" height="230"/>
  <text class="text" x="76" y="128">EGLConfig havuzu</text>
  <rect class="slot" x="74" y="154" width="184" height="30"/><text class="mono" x="96" y="175">Config #0</text>
  <rect class="slot" x="74" y="194" width="184" height="30"/><text class="mono" x="96" y="215">Config #1</text>
  <rect class="slot" x="74" y="234" width="184" height="30"/><text class="mono" x="96" y="255">Config #2</text>
  <rect class="slot" x="74" y="274" width="184" height="30"/><text class="mono" x="96" y="295">Config #3</text>
  <rect class="box" x="392" y="92" width="190" height="230"/>
  <text class="text" x="434" y="128">configs[]</text>
  <rect class="slot" x="428" y="154" width="116" height="30"/><text class="mono" x="444" y="175">handle #0</text>
  <rect class="slot" x="428" y="194" width="116" height="30"/><text class="mono" x="444" y="215">handle #1</text>
  <rect class="slot" x="428" y="234" width="116" height="30"/><text class="mono" x="444" y="255">handle #2</text>
  <path class="line" d="M258 169 L428 169"/>
  <path class="line" d="M258 209 L428 209"/>
  <path class="line" d="M258 249 L428 249"/>
  <rect class="count" x="632" y="136" width="140" height="92"/>
  <text class="text" x="654" y="170">num_config</text>
  <text class="mono" x="676" y="202">= 3</text>
  <path class="line" d="M582 206 L632 184"/>
  <text class="mono" x="82" y="370">Sonuc: configs[0..num_config-1] icine EGLConfig handle'lari yazilir.</text>
</svg>
