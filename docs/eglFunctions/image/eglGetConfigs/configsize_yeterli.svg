<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Yeterli config_size ile tam okuma</title>
  <desc id="desc">Toplam config sayisi kadar kapasite verildiginde tum EGLConfig handle'larinin configs dizisine yazilmasi.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#263238"/></marker>
    <style>
      .bg{fill:#f7fafc}.box{fill:#ffffff;stroke:#263238;stroke-width:2;rx:10}.slot{fill:#e8f7ef;stroke:#177245;stroke-width:2;rx:8}
      .title{font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:700;fill:#111827}.text{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#1f2937}.mono{font-family:Consolas,Menlo,monospace;font-size:15px;fill:#111827}.line{stroke:#263238;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="900" height="430"/>
  <text class="title" x="38" y="45">config_size yeterliyse tum havuz diziye yazilir</text>
  <text class="text" x="38" y="78">Kapasite toplam config sayisina esit oldugunda kopyalanmayan bolum kalmaz.</text>
  <rect class="box" x="55" y="128" width="360" height="170"/>
  <text class="text" x="92" y="160">EGLConfig havuzu</text>
  <rect class="slot" x="86" y="188" width="68" height="48"/><text class="mono" x="108" y="218">#0</text>
  <rect class="slot" x="170" y="188" width="68" height="48"/><text class="mono" x="192" y="218">#1</text>
  <rect class="slot" x="254" y="188" width="68" height="48"/><text class="mono" x="276" y="218">#2</text>
  <rect class="slot" x="338" y="188" width="52" height="48"/><text class="mono" x="352" y="218">#3</text>
  <path class="line" d="M415 210 L505 210"/>
  <rect class="box" x="505" y="128" width="340" height="170"/>
  <text class="text" x="616" y="160">configs[]</text>
  <rect class="slot" x="540" y="188" width="68" height="48"/><text class="mono" x="558" y="218">[0]</text>
  <rect class="slot" x="624" y="188" width="68" height="48"/><text class="mono" x="642" y="218">[1]</text>
  <rect class="slot" x="708" y="188" width="68" height="48"/><text class="mono" x="726" y="218">[2]</text>
  <rect class="slot" x="792" y="188" width="38" height="48"/><text class="mono" x="800" y="218">[3]</text>
  <text class="mono" x="96" y="352">config_size = toplam_config = 4</text>
  <text class="mono" x="520" y="352">num_config = 4, tum handle'lar alindi</text>
</svg>
