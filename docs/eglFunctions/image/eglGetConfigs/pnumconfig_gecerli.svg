<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-labelledby="title desc">
  <title id="title">Geçerli num_config işaretçisi</title>
  <desc id="desc">Geçerli num_config adresine kopyalanan config sayısının yazılması ve başarılı çizim sonucu.</desc>
  <style>
    .bg{fill:#f7fafc}.box{fill:#ffffff;stroke:#263238;stroke-width:2;rx:10}.mem{fill:#eaf2ff;stroke:#2457a6;stroke-width:2;rx:8}.screen{fill:#3d1a47;stroke:#111827;stroke-width:3;rx:10}
    .title{font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:700;fill:#111827}.text{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#1f2937}.mono{font-family:Consolas,Menlo,monospace;font-size:15px;fill:#111827}
  </style>
  <rect class="bg" width="820" height="430"/>
  <text class="title" x="34" y="44">num_config geçerli adres: sayı güvenli yazılır</text>
  <rect class="box" x="48" y="100" width="310" height="210"/>
  <text class="text" x="78" y="140">EGL çağrısı tamamlanır</text>
  <text class="mono" x="78" y="178">eglGetConfigs(..., &amp;n)</text>
  <rect class="mem" x="94" y="214" width="210" height="56"/>
  <text class="mono" x="120" y="249">n = kopyalanan config</text>
  <rect class="screen" x="470" y="100" width="260" height="210"/>
  <polygon points="600,142 520,276 680,276" fill="#22d3ee"/>
  <text class="mono" x="142" y="366">Sonuç: mor zemin üzerinde camgöbeği üçgen çizilir.</text>
</svg>
