<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-labelledby="title desc">
  <title id="title">Gecerli num_config isaretcisi</title>
  <desc id="desc">num_config parametresine verilen adres uzerinden EGLint degiskenine config sayisinin yazilmasi.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#263238"/></marker>
    <style>
      .bg{fill:#f7fafc}.box{fill:#ffffff;stroke:#263238;stroke-width:2;rx:10}.mem{fill:#eaf2ff;stroke:#2457a6;stroke-width:2;rx:8}.ok{fill:#e8f7ef;stroke:#177245;stroke-width:2;rx:8}
      .title{font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:700;fill:#111827}.text{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#1f2937}.mono{font-family:Consolas,Menlo,monospace;font-size:15px;fill:#111827}.line{stroke:#263238;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="820" height="430"/>
  <text class="title" x="34" y="44">num_config gecerli adres: sayi bu adrese yazilir</text>
  <rect class="box" x="54" y="104" width="220" height="170"/>
  <text class="text" x="94" y="142">Uygulama bellegi</text>
  <rect class="mem" x="88" y="174" width="150" height="54"/>
  <text class="mono" x="118" y="207">EGLint n = 0</text>
  <path class="line" d="M274 190 L354 190"/>
  <rect class="box" x="354" y="104" width="190" height="170"/>
  <text class="mono" x="386" y="154">eglGetConfigs</text>
  <text class="mono" x="390" y="188">(..., &amp;n)</text>
  <text class="text" x="396" y="226">N degeri yazilir</text>
  <path class="line" d="M544 190 L624 190"/>
  <rect class="box" x="624" y="104" width="150" height="170"/>
  <text class="text" x="658" y="142">Son durum</text>
  <rect class="ok" x="650" y="174" width="96" height="54"/>
  <text class="mono" x="672" y="207">n = N</text>
  <text class="mono" x="96" y="340">Sonuc: EGL_TRUE, num_config adresindeki EGLint config sayisini tasir.</text>
</svg>
