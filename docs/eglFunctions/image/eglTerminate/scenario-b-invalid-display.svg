<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
  <title id="title">Senaryo B gecersiz display akisi</title>
  <desc id="desc">EGL_NO_DISPLAY ile eglTerminate cagrildiginda beklenen EGL_FALSE ve EGL_BAD_DISPLAY sonucunu gosteren akis.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1080" height="500" fill="#f8fafc"/>
  <text x="540" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Senaryo B: EGL_NO_DISPLAY / Gecersiz Display</text>
  <text x="540" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">Negatif testin odagi: gecersiz dpy icin EGL sonucunu ve hata kodunu dogrulamak.</text>

  <rect x="70" y="138" width="245" height="112" rx="8" fill="#fee2e2" stroke="#dc2626" filter="url(#shadow)"/>
  <text x="192" y="176" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#7f1d1d">Girdi</text>
  <text x="192" y="207" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#991b1b">dpy = EGL_NO_DISPLAY</text>
  <text x="192" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#991b1b">Gecerli EGLDisplay yok</text>

  <line x1="315" y1="194" x2="417" y2="194" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="417" y="138" width="245" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="540" y="181" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#0f172a">eglTerminate(dpy)</text>
  <text x="540" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">EGL davranisi test edilir</text>

  <line x1="662" y1="194" x2="764" y2="194" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="764" y="138" width="245" height="112" rx="8" fill="#f1f5f9" stroke="#64748b" filter="url(#shadow)"/>
  <text x="886" y="174" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Beklenen Sonuc</text>
  <text x="886" y="205" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#334155">return = EGL_FALSE</text>
  <text x="886" y="229" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#334155">error = EGL_BAD_DISPLAY</text>

  <rect x="176" y="340" width="728" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="540" y="370" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Test Notu</text>
  <text x="540" y="394" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">Canli sistemde cagri atlanabilir; ancak EGL 1.0'a gore beklenen sonuc bu sekilde raporlanir.</text>
</svg>
