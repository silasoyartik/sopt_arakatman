<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" role="img" aria-labelledby="title desc">
  <title id="title">Senaryo A gecerli display akisi</title>
  <desc id="desc">Gecerli ve initialize edilmis display icin eglTerminate oncesi ve sonrasi EGL state degisimini gosteren akis.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1180" height="640" fill="#f8fafc"/>
  <text x="590" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Senaryo A: Gecerli ve Initialize Edilmis Display</text>
  <text x="590" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">Basarili yolun odagi: aktif EGL oturumu terminate sonrasinda uninitialized state'e doner.</text>

  <rect x="70" y="134" width="330" height="270" rx="8" fill="#dbeafe" stroke="#2563eb" filter="url(#shadow)"/>
  <text x="235" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Cagridan Once</text>
  <text x="235" y="214" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1e40af">dpy != EGL_NO_DISPLAY</text>
  <text x="235" y="244" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1e40af">eglInitialize OK</text>
  <text x="235" y="274" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1e40af">EGLContext var</text>
  <text x="235" y="304" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1e40af">EGLSurface var</text>
  <text x="235" y="334" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1e40af">Context current olabilir</text>
  <text x="235" y="364" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Render yapilabilmesi sadece yardimci kanittir.</text>

  <line x1="400" y1="269" x2="500" y2="269" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="500" y="192" width="220" height="154" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="610" y="246" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#0f172a">eglTerminate</text>
  <text x="610" y="274" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#0f172a">(display)</text>
  <text x="610" y="312" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#15803d">return = EGL_TRUE</text>

  <line x1="720" y1="269" x2="820" y2="269" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="820" y="134" width="290" height="270" rx="8" fill="#dcfce7" stroke="#16a34a" filter="url(#shadow)"/>
  <text x="965" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">Cagridan Sonra</text>
  <text x="965" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#166534">EGL oturumu kapanir</text>
  <text x="965" y="244" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#166534">Display uninitialized olur</text>
  <text x="965" y="274" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#166534">EGL kaynaklari birakilir</text>
  <text x="965" y="304" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#166534">Normal EGL islemleri icin</text>
  <text x="965" y="328" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#166534">yeniden eglInitialize gerekir</text>

  <rect x="222" y="486" width="736" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="590" y="518" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Native kaynaklar</text>
  <text x="590" y="544" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">DRM fd, GBM device/surface ve pencere kaynaklari eglTerminate ile degil, ayri cleanup ile kapatilir.</text>
</svg>
