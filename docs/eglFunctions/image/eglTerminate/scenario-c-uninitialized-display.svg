<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">Senaryo C initialize edilmemis display akisi</title>
  <desc id="desc">Gecerli fakat initialize edilmemis display icin eglTerminate cagrisi EGL_TRUE dondurur ve aktif EGL kaynagi olmadigini gosterir.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1080" height="520" fill="#f8fafc"/>
  <text x="540" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Senaryo C: Gecerli Fakat Initialize Edilmemis Display</text>
  <text x="540" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">Handle gecerlidir; EGL oturumu baslatilmadigi icin context ve surface yoktur.</text>

  <rect x="68" y="130" width="248" height="128" rx="8" fill="#e0f2fe" stroke="#0284c7" filter="url(#shadow)"/>
  <text x="192" y="164" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#075985">Baslangic</text>
  <text x="192" y="194" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#075985">dpy != EGL_NO_DISPLAY</text>
  <text x="192" y="218" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#075985">eglInitialize cagrilmadi</text>
  <text x="192" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#075985">context / surface yok</text>

  <line x1="316" y1="194" x2="416" y2="194" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="416" y="142" width="248" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="540" y="187" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#0f172a">eglTerminate(dpy)</text>
  <text x="540" y="218" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Initialize edilmemis display</text>

  <line x1="664" y1="194" x2="764" y2="194" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="764" y="130" width="248" height="128" rx="8" fill="#dcfce7" stroke="#16a34a" filter="url(#shadow)"/>
  <text x="888" y="164" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#14532d">Sonuc</text>
  <text x="888" y="194" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#166534">return = EGL_TRUE</text>
  <text x="888" y="218" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#166534">No-op benzeri kapanis</text>
  <text x="888" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#166534">Display uninitialized kalir</text>

  <rect x="180" y="342" width="720" height="82" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="540" y="374" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Neden render yok?</text>
  <text x="540" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">EGL state machine baslamadigi icin config, context, surface ve DRM present adimlari kurulmaz.</text>
</svg>
