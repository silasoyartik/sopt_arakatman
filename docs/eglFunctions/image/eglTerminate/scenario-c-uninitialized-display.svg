<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">Senaryo C initialize edilmemiş display akışı</title>
  <desc id="desc">Geçerli display alındığı halde eglInitialize çağrılmadığında eglTerminate çağrısının güvenli no-op olarak başarılı dönmesini gösteren akış.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1080" height="520" fill="#f8fafc"/>
  <text x="540" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Senaryo C: Geçerli Fakat Initialize Edilmemiş Display</text>
  <text x="540" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">Display handle geçerlidir; fakat EGL state machine başlatılmadığı için render hattı kurulmaz.</text>

  <rect x="68" y="130" width="230" height="106" rx="8" fill="#e0f2fe" stroke="#0284c7" filter="url(#shadow)"/>
  <text x="183" y="166" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#075985">1. Display Alınır</text>
  <text x="183" y="196" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#075985">dpy != EGL_NO_DISPLAY</text>
  <text x="183" y="218" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#075985">Handle geçerli</text>

  <line x1="298" y1="183" x2="398" y2="183" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="398" y="118" width="284" height="130" rx="8" fill="#fff7ed" stroke="#ea580c" filter="url(#shadow)"/>
  <text x="540" y="154" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#7c2d12">2. Bilinçli Olarak Atlanır</text>
  <text x="540" y="186" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#9a3412">eglInitialize(display)</text>
  <text x="540" y="213" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9a3412">Çağrılmadığı için config/context/surface yoktur.</text>

  <line x1="682" y1="183" x2="782" y2="183" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="782" y="130" width="230" height="106" rx="8" fill="#dcfce7" stroke="#16a34a" filter="url(#shadow)"/>
  <text x="897" y="166" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#14532d">3. Terminate</text>
  <text x="897" y="196" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#166534">EGL_TRUE</text>
  <text x="897" y="218" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#166534">Hata yok</text>

  <rect x="140" y="330" width="360" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="320" y="365" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Render Sonucu</text>
  <text x="320" y="394" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">Yeni üçgen çizilmez.</text>
  <text x="320" y="417" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">DRM present denenmez.</text>

  <rect x="580" y="330" width="360" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="760" y="365" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">EGL Sonucu</text>
  <text x="760" y="394" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">Kapatılacak aktif EGL kaynağı yoktur.</text>
  <text x="760" y="417" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">Çağrı güvenli biçimde tamamlanır.</text>
</svg>
