<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">eglTerminate kaynak ayrimi</title>
  <desc id="desc">eglTerminate cagrisi sonrasi EGL kaynaklari ile native kaynaklarin farkli temizlenme sorumluluklarini gosteren sema.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1120" height="560" fill="#f8fafc"/>
  <text x="560" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">eglTerminate Neyi Kapatir?</text>
  <text x="560" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">EGL oturumu ile native platform kaynaklari ayni cleanup sorumlulugu degildir.</text>

  <rect x="70" y="128" width="380" height="260" rx="8" fill="#dbeafe" stroke="#2563eb" filter="url(#shadow)"/>
  <text x="260" y="164" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Cagri Oncesi: EGL Tarafi</text>
  <text x="260" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1e40af">display initialized</text>
  <text x="260" y="242" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1e40af">EGLContext</text>
  <text x="260" y="274" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1e40af">EGLSurface</text>
  <text x="260" y="306" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1e40af">EGL config / state</text>

  <rect x="670" y="128" width="380" height="260" rx="8" fill="#f1f5f9" stroke="#64748b" filter="url(#shadow)"/>
  <text x="860" y="164" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Cagri Oncesi: Native Taraf</text>
  <text x="860" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">DRM file descriptor</text>
  <text x="860" y="242" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">GBM device</text>
  <text x="860" y="274" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">GBM surface</text>
  <text x="860" y="306" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">native window / platform state</text>

  <rect x="478" y="198" width="164" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="560" y="232" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#0f172a">eglTerminate</text>
  <text x="560" y="256" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#0f172a">(dpy)</text>
  <line x1="450" y1="240" x2="478" y2="240" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="642" y1="240" x2="670" y2="240" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="70" y="434" width="380" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="260" y="462" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#14532d">Sonra: EGL oturumu kapanir</text>
  <text x="260" y="486" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#166534">Display uninitialized olur, EGL kaynaklari birakilir.</text>

  <rect x="670" y="434" width="380" height="70" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="860" y="462" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c2d12">Sonra: native kaynaklar durur</text>
  <text x="860" y="486" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9a3412">DRM/GBM/window kaynaklari ayrica temizlenmelidir.</text>
</svg>
