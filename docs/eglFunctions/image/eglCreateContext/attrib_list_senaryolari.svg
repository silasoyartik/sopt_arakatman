<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-label="attrib_list EGL 1.0 senaryolari">
  <rect width="1100" height="500" fill="#f6f8fb"/>
  <style>
    .title{font:700 27px Arial,sans-serif;fill:#111827}
    .label{font:700 20px Arial,sans-serif;fill:#111827}
    .small{font:16px Arial,sans-serif;fill:#374151}
    .code{font:15px Consolas,monospace;fill:#111827}
    .box{fill:#ffffff;stroke:#111827;stroke-width:2.5;rx:8}
    .ok{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:8}
    .err{fill:#fef2f2;stroke:#ef4444;stroke-width:2;rx:8}
    .chip{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:6}
    .arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrowhead)}
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">attrib_list: EGL 1.0 context attribute listesi</text>

  <rect x="70" y="105" width="290" height="205" class="box"/>
  <rect x="105" y="132" width="220" height="40" class="chip"/>
  <text x="215" y="157" text-anchor="middle" class="code">attrib_list = NULL</text>
  <text x="215" y="210" text-anchor="middle" class="label">Ek attribute yok</text>
  <text x="215" y="244" text-anchor="middle" class="small">EGL 1.0 icin normal kullanim</text>
  <text x="215" y="272" text-anchor="middle" class="small">Context olusturma denenir</text>

  <rect x="405" y="105" width="290" height="205" class="box"/>
  <rect x="440" y="132" width="220" height="40" class="chip"/>
  <text x="550" y="157" text-anchor="middle" class="code">{ EGL_NONE }</text>
  <text x="550" y="210" text-anchor="middle" class="label">Bos attribute listesi</text>
  <text x="550" y="244" text-anchor="middle" class="small">Ilk attribute EGL_NONE</text>
  <text x="550" y="272" text-anchor="middle" class="small">Context olusturma denenir</text>

  <rect x="740" y="105" width="290" height="205" class="box"/>
  <rect x="775" y="125" width="220" height="64" class="chip"/>
  <text x="885" y="150" text-anchor="middle" class="code">unsupported</text>
  <text x="885" y="174" text-anchor="middle" class="code">attribute/value</text>
  <text x="885" y="220" text-anchor="middle" class="label">Gecersiz attribute</text>
  <text x="885" y="254" text-anchor="middle" class="small">EGL 1.0 core tarafindan</text>
  <text x="885" y="282" text-anchor="middle" class="small">tanimlanmayan istek</text>

  <path d="M215 310 L215 360" class="arrow"/>
  <path d="M550 310 L550 360" class="arrow"/>
  <path d="M885 310 L885 360" class="arrow"/>

  <rect x="95" y="360" width="240" height="72" class="ok"/>
  <text x="215" y="389" text-anchor="middle" class="label">Basari yolu</text>
  <text x="215" y="416" text-anchor="middle" class="small">ctx != EGL_NO_CONTEXT</text>

  <rect x="430" y="360" width="240" height="72" class="ok"/>
  <text x="550" y="389" text-anchor="middle" class="label">Basari yolu</text>
  <text x="550" y="416" text-anchor="middle" class="small">ctx != EGL_NO_CONTEXT</text>

  <rect x="765" y="360" width="240" height="72" class="err"/>
  <text x="885" y="389" text-anchor="middle" class="label">Hata yolu</text>
  <text x="885" y="416" text-anchor="middle" class="small">EGL_BAD_ATTRIBUTE</text>
</svg>
