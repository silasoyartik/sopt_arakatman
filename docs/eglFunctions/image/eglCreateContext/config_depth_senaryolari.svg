<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-label="config depth buffer yok ve var senaryoları">
  <rect width="1100" height="500" fill="#f6f8fb"/>
  <style>
    .title{font:700 27px Arial,sans-serif;fill:#111827}
    .label{font:700 20px Arial,sans-serif;fill:#111827}
    .small{font:16px Arial,sans-serif;fill:#374151}
    .code{font:15px Consolas,monospace;fill:#111827}
    .screen{stroke:#111827;stroke-width:3;rx:8}
    .chip{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:6}
  </style>

  <text x="550" y="42" text-anchor="middle" class="title">config değişimi: depth buffer yoksa çizim sırası, varsa z değeri belirleyici olur</text>

  <rect x="90" y="95" width="365" height="235" class="screen" fill="#171717"/>
  <polygon points="250,125 145,290 355,290" fill="#dc2626"/>
  <polygon points="300,135 195,300 405,300" fill="#2563eb"/>
  <rect x="120" y="112" width="180" height="36" class="chip"/>
  <text x="210" y="136" text-anchor="middle" class="code">EGL_DEPTH_SIZE = 0</text>
  <text x="272" y="370" text-anchor="middle" class="label">Senaryo A: Depth buffer yok</text>
  <text x="272" y="397" text-anchor="middle" class="small">mavi üçgen sonra çizildiği için üstte görünür</text>
  <text x="272" y="424" text-anchor="middle" class="small">z karşılaştırması sonucu koruyamaz</text>

  <rect x="645" y="95" width="365" height="235" class="screen" fill="#171717"/>
  <polygon points="855,135 750,300 960,300" fill="#2563eb"/>
  <polygon points="805,125 700,290 910,290" fill="#dc2626"/>
  <rect x="675" y="112" width="188" height="36" class="chip"/>
  <text x="769" y="136" text-anchor="middle" class="code">EGL_DEPTH_SIZE = 16</text>
  <text x="827" y="370" text-anchor="middle" class="label">Senaryo B: Depth buffer var</text>
  <text x="827" y="397" text-anchor="middle" class="small">kırmızı üçgen z değerine göre önde kalır</text>
  <text x="827" y="424" text-anchor="middle" class="small">aynı çizim sırası farklı görüntü üretir</text>
</svg>
