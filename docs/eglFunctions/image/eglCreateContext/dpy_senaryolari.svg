<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-label="dpy parametresi ana ve yedek ekran senaryoları">
  <rect width="1100" height="500" fill="#f6f8fb"/>
  <style>
    .title{font:700 27px Arial,sans-serif;fill:#111827}
    .label{font:700 20px Arial,sans-serif;fill:#111827}
    .small{font:16px Arial,sans-serif;fill:#374151}
    .code{font:15px Consolas,monospace;fill:#111827}
    .screen{stroke:#111827;stroke-width:3;rx:8}
    .chip{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:6}
    .arrow{stroke:#1f2937;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">dpy değişimi: context farklı display yoluna bağlanır</text>

  <rect x="90" y="95" width="365" height="235" class="screen" fill="#051525"/>
  <rect x="90" y="260" width="365" height="70" fill="#0088d6"/>
  <polygon points="272,140 192,255 352,255" fill="#15d768"/>
  <rect x="126" y="112" width="160" height="36" class="chip"/>
  <text x="206" y="136" text-anchor="middle" class="code">display index = 0</text>
  <text x="272" y="370" text-anchor="middle" class="label">Senaryo A: Ana ekran</text>
  <text x="272" y="397" text-anchor="middle" class="small">koyu mavi zemin + camgöbeği bant + yeşil üçgen</text>
  <text x="272" y="424" text-anchor="middle" class="small">context ana EGLDisplay handle'ı üzerinde oluşur</text>

  <rect x="645" y="95" width="365" height="235" class="screen" fill="#2b1705"/>
  <rect x="645" y="95" width="365" height="70" fill="#f97316"/>
  <polygon points="827,140 747,255 907,255" fill="#fde047"/>
  <rect x="681" y="112" width="160" height="36" class="chip"/>
  <text x="761" y="136" text-anchor="middle" class="code">display index = 1</text>
  <text x="827" y="370" text-anchor="middle" class="label">Senaryo B: Yedek ekran</text>
  <text x="827" y="397" text-anchor="middle" class="small">kahverengi zemin + turuncu bant + sarı üçgen</text>
  <text x="827" y="424" text-anchor="middle" class="small">context yedek display/native yolunda oluşur</text>

  <path class="arrow" d="M490 214 L610 214"/>
  <text x="550" y="196" text-anchor="middle" class="small">değişen parametre: dpy</text>
</svg>
