<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-label="dpy EGLDisplay baglanti yolu senaryolari">
  <rect width="1100" height="500" fill="#f6f8fb"/>
  <style>
    .title{font:700 27px Arial,sans-serif;fill:#111827}
    .label{font:700 20px Arial,sans-serif;fill:#111827}
    .small{font:16px Arial,sans-serif;fill:#374151}
    .code{font:15px Consolas,monospace;fill:#111827}
    .box{fill:#ffffff;stroke:#111827;stroke-width:2.5;rx:8}
    .display{fill:#e0f2fe;stroke:#0284c7;stroke-width:2.5;rx:8}
    .context{fill:#ecfdf5;stroke:#10b981;stroke-width:2.5;rx:8}
    .chip{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:6}
    .arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrowhead)}
    .stand{stroke:#111827;stroke-width:3;fill:none}
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">dpy: context'in kullanacagi EGLDisplay baglantisi</text>

  <rect x="70" y="95" width="435" height="305" class="box"/>
  <text x="287" y="132" text-anchor="middle" class="label">Display 0 yolu</text>

  <rect x="115" y="162" width="150" height="88" class="display"/>
  <rect x="132" y="178" width="116" height="50" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <path d="M175 250 L205 250 M190 250 L190 270 M165 270 L215 270" class="stand"/>
  <text x="190" y="300" text-anchor="middle" class="code">native display 0</text>

  <path d="M270 206 L340 206" class="arrow"/>
  <rect x="345" y="172" width="120" height="68" class="chip"/>
  <text x="405" y="198" text-anchor="middle" class="code">dpy</text>
  <text x="405" y="222" text-anchor="middle" class="code">EGLDisplay A</text>

  <path d="M405 245 L405 305" class="arrow"/>
  <rect x="295" y="310" width="220" height="58" class="context"/>
  <text x="405" y="334" text-anchor="middle" class="code">eglCreateContext</text>
  <text x="405" y="357" text-anchor="middle" class="small">context Display 0 uzerinde olusur</text>

  <rect x="595" y="95" width="435" height="305" class="box"/>
  <text x="812" y="132" text-anchor="middle" class="label">Display 1 yolu</text>

  <rect x="640" y="162" width="150" height="88" class="display"/>
  <rect x="657" y="178" width="116" height="50" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <path d="M700 250 L730 250 M715 250 L715 270 M690 270 L740 270" class="stand"/>
  <text x="715" y="300" text-anchor="middle" class="code">native display 1</text>

  <path d="M795 206 L865 206" class="arrow"/>
  <rect x="870" y="172" width="120" height="68" class="chip"/>
  <text x="930" y="198" text-anchor="middle" class="code">dpy</text>
  <text x="930" y="222" text-anchor="middle" class="code">EGLDisplay B</text>

  <path d="M930 245 L930 305" class="arrow"/>
  <rect x="820" y="310" width="220" height="58" class="context"/>
  <text x="930" y="334" text-anchor="middle" class="code">eglCreateContext</text>
  <text x="930" y="357" text-anchor="middle" class="small">context Display 1 uzerinde olusur</text>

  <rect x="415" y="420" width="270" height="42" class="chip"/>
  <text x="550" y="447" text-anchor="middle" class="small">Degisen girdi: eglCreateContext icin verilen dpy handle'i</text>
</svg>
