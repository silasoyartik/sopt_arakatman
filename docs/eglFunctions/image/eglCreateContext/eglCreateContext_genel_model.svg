<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-label="eglCreateContext genel çalışma modeli">
  <rect width="1100" height="600" fill="#f6f8fb"/>
  <style>
    .title{font:700 28px Arial,sans-serif;fill:#111827}
    .box{fill:#ffffff;stroke:#1f2937;stroke-width:2;rx:8}
    .input{fill:#eaf2ff;stroke:#2563eb;stroke-width:2;rx:8}
    .share{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:8}
    .ctx{fill:#ecfdf3;stroke:#15803d;stroke-width:2.5;rx:8}
    .surface{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:8}
    .txt{font:700 21px Arial,sans-serif;fill:#111827}
    .small{font:16px Arial,sans-serif;fill:#374151}
    .code{font:15px Consolas,monospace;fill:#111827}
    .arrow{stroke:#1f2937;stroke-width:2.6;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
  </defs>

  <text x="550" y="45" text-anchor="middle" class="title">eglCreateContext: dört parametre yeni context'in davranışını belirler</text>

  <rect x="55" y="95" width="235" height="92" class="input"/>
  <text x="172" y="128" text-anchor="middle" class="txt">EGLDisplay</text>
  <text x="172" y="154" text-anchor="middle" class="code">dpy</text>
  <text x="172" y="176" text-anchor="middle" class="small">hangi display yolu?</text>

  <rect x="315" y="95" width="235" height="92" class="input"/>
  <text x="432" y="128" text-anchor="middle" class="txt">EGLConfig</text>
  <text x="432" y="154" text-anchor="middle" class="code">config</text>
  <text x="432" y="176" text-anchor="middle" class="small">renk, depth, surface tipi</text>

  <rect x="575" y="95" width="235" height="92" class="share"/>
  <text x="692" y="128" text-anchor="middle" class="txt">EGLContext</text>
  <text x="692" y="154" text-anchor="middle" class="code">share_context</text>
  <text x="692" y="176" text-anchor="middle" class="small">kaynak paylaşımı?</text>

  <rect x="835" y="95" width="235" height="92" class="input"/>
  <text x="952" y="128" text-anchor="middle" class="txt">Attribute list</text>
  <text x="952" y="154" text-anchor="middle" class="code">attrib_list</text>
  <text x="952" y="176" text-anchor="middle" class="small">EGL_NONE / GLES2 isteği</text>

  <rect x="350" y="280" width="400" height="105" class="ctx"/>
  <text x="550" y="318" text-anchor="middle" class="txt">eglCreateContext(...)</text>
  <text x="550" y="349" text-anchor="middle" class="small">başarılıysa yeni bir EGLContext döner</text>
  <text x="550" y="373" text-anchor="middle" class="code">başarısızsa EGL_NO_CONTEXT</text>

  <rect x="365" y="470" width="370" height="80" class="surface"/>
  <text x="550" y="503" text-anchor="middle" class="txt">eglMakeCurrent</text>
  <text x="550" y="530" text-anchor="middle" class="small">context + surface + thread aktif bağlanır</text>

  <path class="arrow" d="M172 187 C210 245,315 275,350 307"/>
  <path class="arrow" d="M432 187 C445 235,478 260,505 280"/>
  <path class="arrow" d="M692 187 C675 235,642 260,604 280"/>
  <path class="arrow" d="M952 187 C892 250,800 275,750 315"/>
  <path class="arrow" d="M550 385 L550 470"/>
</svg>
