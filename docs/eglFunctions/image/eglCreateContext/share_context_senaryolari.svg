<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="share_context kaynak paylaşımı senaryoları">
  <rect width="1100" height="520" fill="#f6f8fb"/>
  <style>
    .title{font:700 27px Arial,sans-serif;fill:#111827}
    .label{font:700 20px Arial,sans-serif;fill:#111827}
    .small{font:16px Arial,sans-serif;fill:#374151}
    .code{font:15px Consolas,monospace;fill:#111827}
    .box{fill:#fff;stroke:#111827;stroke-width:2;rx:8}
    .bad{fill:#fee2e2;stroke:#b91c1c;stroke-width:2;rx:8}
    .good{fill:#dcfce7;stroke:#15803d;stroke-width:2;rx:8}
    .arrow{stroke:#1f2937;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    .no{stroke:#b91c1c;stroke-width:6;stroke-linecap:round}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">share_context değişimi: texture kaynağı tanınmaz ya da paylaşılır</text>

  <rect x="75" y="95" width="180" height="68" class="box"/>
  <text x="165" y="136" text-anchor="middle" class="label">Context 1</text>
  <rect x="75" y="220" width="180" height="68" class="box"/>
  <text x="165" y="261" text-anchor="middle" class="label">Context 2</text>
  <rect x="320" y="120" width="130" height="130" class="bad"/>
  <rect x="345" y="145" width="40" height="40" fill="#fde047"/>
  <rect x="385" y="145" width="40" height="40" fill="#111827"/>
  <rect x="345" y="185" width="40" height="40" fill="#111827"/>
  <rect x="385" y="185" width="40" height="40" fill="#fde047"/>
  <line x1="332" y1="238" x2="438" y2="132" class="no"/>
  <path class="arrow" d="M255 129 L320 154"/>
  <path class="arrow" d="M255 254 L316 224"/>
  <text x="262" y="350" text-anchor="middle" class="label">Senaryo A: EGL_NO_CONTEXT</text>
  <text x="262" y="378" text-anchor="middle" class="small">ikinci context birinci context'in texture nesnesini tanımaz</text>
  <text x="262" y="405" text-anchor="middle" class="code">glIsTexture(texture) → false</text>

  <rect x="650" y="95" width="180" height="68" class="box"/>
  <text x="740" y="136" text-anchor="middle" class="label">Context 1</text>
  <rect x="650" y="220" width="180" height="68" class="box"/>
  <text x="740" y="261" text-anchor="middle" class="label">Context 2</text>
  <rect x="890" y="120" width="130" height="130" class="good"/>
  <rect x="915" y="145" width="40" height="40" fill="#fde047"/>
  <rect x="955" y="145" width="40" height="40" fill="#111827"/>
  <rect x="915" y="185" width="40" height="40" fill="#111827"/>
  <rect x="955" y="185" width="40" height="40" fill="#fde047"/>
  <path class="arrow" d="M830 129 L890 154"/>
  <path class="arrow" d="M830 254 L888 224"/>
  <text x="833" y="350" text-anchor="middle" class="label">Senaryo B: share_context = main_ctx</text>
  <text x="833" y="378" text-anchor="middle" class="small">ikinci context aynı texture nesnesini kullanabilir</text>
  <text x="833" y="405" text-anchor="middle" class="code">glIsTexture(texture) → true</text>
</svg>
